<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Looby Earning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        :root {
            --primary-color: #E74C3C;
            --secondary-color: #F39C12;
            --background-dark: #1B2631;
            --surface-dark: #283747;
            --text-primary-dark: #FDFEFE;
            --text-secondary-dark: #ABB2B9;
            --border-dark: #566573;
            --success: #27AE60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--background-dark); color: var(--text-primary-dark); -webkit-font-smoothing: antialiased; }
        #app { max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        
        .profile-header {
            padding: 25px 15px; border-bottom: 1px solid var(--border-dark);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            background-color: var(--surface-dark);
        }
        #user-photo { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--primary-color); object-fit: cover; margin-bottom: 10px; }
        #user-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
        #user-balance-container { font-size: 1rem; font-weight: 500; }
        #user-balance { font-size: 1.1rem; font-weight: 700; color: var(--primary-color); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .stat-card { padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border-dark); background-color: var(--surface-dark); }
        .stat-card h3 { font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; text-transform: uppercase; color: var(--text-secondary-dark); }
        .stat-card p { font-size: 1.4rem; font-weight: 600; color: var(--primary-color); }
        
        .earning-wallet-card, .chart-container { padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid var(--border-dark); background-color: var(--surface-dark); }
        .action-btn { padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: #fff; border: none; border-radius: 8px; cursor: pointer; background: linear-gradient(45deg, var(--primary-color), var(--secondary-color)); width: 100%; margin-top: 10px; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-dark); background-color: var(--surface-dark); z-index: 1000; }
        .nav-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: var(--text-secondary-dark); font-size: 0.75rem; flex-grow: 1; }
        .nav-btn i { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-btn.active { color: var(--primary-color); }

        .task-container { padding: 15px; border-radius: 12px; margin-top: 15px; background-color: var(--surface-dark); border: 1px solid var(--border-dark); }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid var(--border-dark); background: #1B2631; color: #fff; text-align: center; }

        #app-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: var(--background-dark); }
        .spinner { width: 50px; height: 50px; border-radius: 50%; border: 5px solid; border-color: var(--primary-color) transparent; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-progress { margin-top: 15px; font-size: 1.2rem; font-weight: 600; }
    </style>
</head>
<body>
    <div id="app-loader">
        <div class="spinner"></div>
        <p id="loading-progress">0%</p>
    </div>

    <div id="app" style="display: none;">
        <header class="profile-header">
            <img id="user-photo" src="https://via.placeholder.com/80" alt="User">
            <h1 id="user-name">ተጠቃሚ</h1>
            <div id="user-balance-container">ዋና ሂሳብ፦ <span id="user-balance">0.00</span> ETB</div>
        </header>

        <main>
            <div id="home-page" class="page active">
                <div class="stats-grid">
                    <div class="stat-card"><h3>የዛሬ ማስታወቂያ</h3><p id="daily-ads">0 / 15</p></div>
                    <div class="stat-card"><h3>ጠቅላላ ግብዣ</h3><p id="ref-count">0</p></div>
                    <div class="stat-card"><h3>የታዩ ማስታወቂያዎች</h3><p id="total-ads">0</p></div>
                    <div class="stat-card"><h3>ጠቅላላ ገቢ</h3><p id="total-income">0.00</p></div>
                </div>
                <div class="task-container">
                    <h3>ማስታወቂያዎችን በመመልከት ያግኙ</h3>
                    <p>በእያንዳንዱ እይታ 1.00 ETB ወደ አካውንትዎ ይጨመራል</p>
                    <button class="action-btn" id="watch-btn">ማስታወቂያ ይመልከቱ</button>
                </div>
            </div>

            <div id="tasks-page" class="page">
                <div class="earning-wallet-card">
                    <h3>Earning Wallet</h3>
                    <h2 style="color: var(--primary-color); margin: 10px 0;"><span id="wallet-bal">0.00</span> ETB</h2>
                    <small>ወደ ዋናው ሂሳብ ለማስተላለፍ ቢያንስ 50 ETB ያስፈልጋል።</small>
                    <button class="action-btn" id="transfer-btn">ወደ ዋና ሂሳብ አዛውር</button>
                </div>
            </div>

            <div id="profile-page" class="page">
                <div class="task-container">
                    <h3>ጓደኞችህን ጋብዝ</h3>
                    <p>በእያንዳንዱ ሰው 5.00 ETB ያግኙ</p>
                    <input type="text" id="ref-link" readonly value="https://t.me/your_bot">
                    <button class="action-btn" id="copy-btn">ሊንኩን ኮፒ አድርግ</button>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-btn active" data-page="home-page"><i class="fas fa-home"></i><span>መነሻ</span></button>
            <button class="nav-btn" data-page="tasks-page"><i class="fas fa-tasks"></i><span>ገንዘብ ማስተላለፊያ</span></button>
            <button class="nav-btn" data-page="profile-page"><i class="fas fa-user"></i><span>መገለጫ</span></button>
        </nav>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let progress = 0;
        const progressEl = document.getElementById('loading-progress');

        const interval = setInterval(() => {
            progress += 25;
            if (progressEl) progressEl.textContent = progress + '%';
            if (progress >= 100) {
                clearInterval(interval);
                document.getElementById('app-loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            }
        }, 150);

        if (tg) {
            try { tg.ready(); tg.expand(); } catch(e){}
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                document.getElementById('user-name').textContent = u.first_name || 'ተጠቃሚ';
                if (u.photo_url) document.getElementById('user-photo').src = u.photo_url;
                document.getElementById('ref-link').value = `https://t.me/Crypto_Topup_F_bot?start=${u.id}`;
            }
        }

        let balance = parseFloat(localStorage.getItem('user_balance') || '0');
        let wallet = parseFloat(localStorage.getItem('user_wallet') || '0');
        let adsCount = parseInt(localStorage.getItem('user_ads') || '0');

        function updateUI() {
            document.getElementById('user-balance').textContent = balance.toFixed(2);
            document.getElementById('wallet-bal').textContent = wallet.toFixed(2);
            document.getElementById('daily-ads').textContent = `${adsCount} / 15`;
            document.getElementById('total-ads').textContent = adsCount;
            document.getElementById('total-income').textContent = (balance + wallet).toFixed(2);
        }
        updateUI();

        document.getElementById('watch-btn').addEventListener('click', () => {
            if (adsCount >= 15) { alert('የዛሬውን ገደብ ጨርሰዋል!'); return; }
            alert('ማስታወቂያ ተመልክተዋል! 1.00 ETB ወደ ቦርሳህ ተጨምሯል።');
            wallet += 1.0;
            adsCount += 1;
            localStorage.setItem('user_wallet', wallet);
            localStorage.setItem('user_ads', adsCount);
            updateUI();
        });

        document.getElementById('transfer-btn').addEventListener('click', () => {
            if (wallet < 50) { alert('ቢያንስ 50 ETB ያስፈልጋል!'); return; }
            balance += wallet;
            wallet = 0;
            localStorage.setItem('user_balance', balance);
            localStorage.setItem('user_wallet', 0);
            alert('ገንዘቡ በተሳካ ሁኔታ ተዛውሯል!');
            updateUI();
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const input = document.getElementById('ref-link');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('የግብዣ ሊንክ ተገልብጧል!');
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.page).classList.add('active');
            });
        });
    });
    </script>
</body>
</html>
